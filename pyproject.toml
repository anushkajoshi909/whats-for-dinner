[project]
name = "whats-for-dinner"
version = "0.1.0"
description = ""

requires-python = ">=3.12"
dependencies = [
    "haystack-ai==2.12.0",
    "pgvector-haystack==3.4.1",
    "fastapi>=0.115.0",
    "pillow>=10.4.0",
    "uvicorn[standard]>=0.27.0",
    "psycopg[binary]>=3.2.6",
    "pydantic-settings>=2.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "anyio>=4.6.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["whats_for_dinner*"]

[tool.pytest.ini_options]
testpaths = ["src", "eval"]

[tool.pyright]
include = ["src", "eval"]
# Investigated "strict": after fixing every legitimate issue it found in our own
# code, 33 errors remained, and every one of them was either (a) "Stub file not
# found" on a haystack-ai/haystack_integrations import - haystack-ai ships no
# type stubs, and this fires in literally every file that touches the pipeline,
# not a couple of isolated spots - or (b) inside the supplied, unused
# custom_components.py bonus stub. There's no clean fix short of hand-writing a
# stub package for a pinned third-party library, which is disproportionate for
# a PoC. "basic" is the practical choice; see README "Design decisions".
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
src = ["src"]
# ruff format also reformats fenced Python code blocks inside Markdown files.
# CHALLENGE.md/CONVENTIONS.md are supplied and authoritative - not ours to
# reformat - and PIPELINE.md/PROMPT.md are internal, gitignored build notes.
extend-exclude = ["CHALLENGE.md", "CONVENTIONS.md", "PIPELINE.md", "PROMPT.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
