[project]
name = "whats-for-dinner"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]

requires-python = ">=3.12"
dependencies = [
    "haystack-ai==2.12.0",
    "pgvector-haystack==3.4.1",
    "fastapi>=0.115.0",
    "pillow>=10.4.0",
    "uvicorn[standard]>=0.27.0",
    "psycopg[binary]>=3.2.6",
    "pydantic-settings>=2.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "anyio>=4.6.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["whats_for_dinner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests", "eval"]
typeCheckingMode = "basic"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
